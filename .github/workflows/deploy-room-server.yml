name: Deploy Mumu Jinjin Friend Room Server

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref with reviewed worker source'
        required: true
        default: 'feature/friends-zhixu-ui-20261106'

permissions:
  contents: read

concurrency:
  group: mmjj-friends-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed Worker source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve original Cloudflare account from scoped token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_NAME: "Ndshuge@gmail.com's Account"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          response="$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
          account_id="$(jq -er --arg name "$CF_ACCOUNT_NAME" \
            '.result[] | select(.name == $name) | .id' <<< "$response")"
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "Account verified."
      - name: Deploy Durable Objects Worker
        working-directory: online
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.158.0 deploy
