name: Deploy Mumu Jinjin Friend Room Server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'online/**'
      - 'online-rules.mjs'
      - '.github/workflows/deploy-room-server.yml'

permissions:
  contents: read

concurrency:
  group: mmjj-friends-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Durable Objects Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve authorized Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_NAME: "Ndshuge@gmail.com's Account"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          response="$(curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
          account_id="$(jq -er --arg name "$CF_ACCOUNT_NAME" \
            '.result[] | select(.name == $name) | .id' <<< "$response")"
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "Cloudflare account resolved for authorized account name."
      - name: Deploy Durable Objects Worker
        working-directory: online
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.158.0 deploy
