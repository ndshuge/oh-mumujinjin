<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小克 · 视觉设计预览</title>
<link rel="stylesheet" href="./xiaoke-preview.css">
<style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif}
body{display:grid;place-items:center;min-height:100dvh;padding:18px;box-sizing:border-box;background:radial-gradient(circle at 15% 12%,#f8dace,#edf3e8 60%,#d3e8dc)}
.design-note{max-width:440px;margin:0 auto 13px;font-size:12px;color:#77655d;text-align:center;line-height:1.7}
.preview-card{width:min(440px,calc(100vw - 32px));box-sizing:border-box;}
</style></head>
<body><main class="preview-card"><p class="design-note">《哦，木木金金棋》 · 新 AI 角色形象提案</p>
<div class="xiaoke-preview-inner">
<div class="xiaoke-preview-top"><span class="xiaoke-preview-kicker">GUEST · CHARACTER PREVIEW</span><span aria-hidden="true" style="font-size:22px;color:#92634f">⌁</span></div>
<div class="xiaoke-avatar-wrap"><img src="./claude-avatar.svg" alt="Claude 标志"></div>
<h1 class="xiaoke-preview-title">小克</h1><p class="xiaoke-preview-sub">即将加入棋局的神秘对手</p>
<div class="xiaoke-speech-box"><p>⌁∿⟡‽</p></div>
<div class="xiaoke-event-tabs">
<span style="background:#d97757;color:#fff;border-radius:99px;padding:8px 12px;font-size:11px">开场</span>
<span style="background:#fff9f4;color:#92634f;border-radius:99px;padding:8px 12px;font-size:11px">思考</span>
<span style="background:#fff9f4;color:#92634f;border-radius:99px;padding:8px 12px;font-size:11px">筑墙</span>
<span style="background:#fff9f4;color:#92634f;border-radius:99px;padding:8px 12px;font-size:11px">紧张</span></div>
<button type="button" class="xiaoke-next">再听一句 ↗</button>
<p class="xiaoke-preview-note">只展示形象与对白。经典 / 进阶模型尚未接入，现有对局不变。</p>
</div></main></body></html>
